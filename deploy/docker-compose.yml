# Production deployment behind a reverse proxy (nginx).
# On the server, next to a .env file created from .env.example:
#   docker compose pull && docker compose up -d
services:
  app:
    image: ghcr.io/marob/genealogy:latest
    # Listens locally only: nginx handles HTTPS.
    ports:
      - '127.0.0.1:3100:3000'
    env_file: .env
    volumes:
      - genealogie-data:/data
    restart: unless-stopped

volumes:
  genealogie-data:
