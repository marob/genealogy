# Production deployment behind a reverse proxy (nginx).
# On the server, next to a .env file created from .env.example:
#   docker compose pull && docker compose up -d
services:
  app:
    image: ghcr.io/marob/genealogy:latest
    # Listens locally only: nginx handles HTTPS.
    ports:
      - '127.0.0.1:3100:3000'
    env_file: .env
    # Sized for a small server (1 GB of RAM): measured at about 180 MB at rest
    # and 380 MB at the peak of an import with its documents.
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      MALLOC_ARENA_MAX: '2'
      VIPS_CONCURRENCY: '1'
    mem_limit: 600m
    volumes:
      - genealogie-data:/data
    restart: unless-stopped

volumes:
  genealogie-data:
