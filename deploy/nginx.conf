# nginx site (/etc/nginx/sites-available/genealogierobert). The HTTPS
# directives (certificates, redirect from port 80) are added by
# "certbot --nginx -d genealogierobert.duckdns.org".

# API rate limit per client IP (site files are included in the http context).
limit_req_zone $binary_remote_addr zone=genealogie_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name genealogierobert.duckdns.org;

    server_tokens off;
    client_max_body_size 1m;

    # Personal data: no indexing by search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3100;
    }

    location /api/ {
        limit_req zone=genealogie_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
    }

    # GEDCOM imports with their documents archive: large uploads streamed to
    # the application (no buffering in nginx) and long processing.
    location = /api/admin/imports {
        limit_req zone=genealogie_api burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 4g;
        proxy_request_buffering off;
        client_body_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:3100;
    }
    location ~ ^/api/admin/imports/\d+/commit$ {
        limit_req zone=genealogie_api burst=100 nodelay;
        limit_req_status 429;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3100;
    }
}
