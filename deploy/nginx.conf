# Site nginx (/etc/nginx/sites-available/genealogierobert). Les directives
# HTTPS (certificats, redirection depuis le port 80) sont ajoutées par
# « certbot --nginx -d genealogierobert.duckdns.org ».
server {
    listen 80;
    listen [::]:80;
    server_name genealogierobert.duckdns.org;

    # Import de fichiers GEDCOM.
    client_max_body_size 100m;

    # Données personnelles : pas d'indexation par les moteurs de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
