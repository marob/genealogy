# nginx site (/etc/nginx/sites-available/genealogierobert). The HTTPS
# directives (certificates, redirect from port 80) are added by
# "certbot --nginx -d genealogierobert.duckdns.org".
server {
    listen 80;
    listen [::]:80;
    server_name genealogierobert.duckdns.org;

    # GEDCOM file imports.
    client_max_body_size 100m;

    # Personal data: no indexing by search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
