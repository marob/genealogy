# Run the image locally: http://localhost:8080
#   docker compose up --build
# Data (SQLite database) is kept in the "genealogie-data" volume.
services:
  app:
    build: .
    image: genealogie:local
    ports:
      - '8080:3000'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (at least 32 characters) in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Handy for a local trial without an OIDC provider; rejected if PUBLIC_URL is not localhost.
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-false}
    volumes:
      - genealogie-data:/data
    restart: unless-stopped

volumes:
  genealogie-data:
